name: Bug Report
description: File a bug report to help improve NexusOps
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest version and that your issue hasn't already been reported.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'make up'
        2. Navigate to '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Provide system and tool versions.
      value: |
        - OS: [e.g. Ubuntu 22.04 / macOS 14]
        - Docker version: [e.g. 26.0.0]
        - Docker Compose version: [e.g. 2.26.0]
    validations:
      required: true
  - type: checkboxes
    id: checklists
    attributes:
      label: Checklist
      options:
        - label: I have verified that no private credentials or secrets are included in this report.
          required: true
        - label: I ran `make doctor` and checked for known port or configuration issues.
          required: false
