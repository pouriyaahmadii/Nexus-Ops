# GitHub Actions - Release Pipeline
# Uses release-please for Conventional Commits driven releases

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write
  pull-requests: write
  id-token: write

jobs:
  # ==========================================================================
  # Release Please - Creates release PR
  # ==========================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Release Please
        id: release
        uses: google-github-actions/release-please-action@3c7b4b3c5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5e5 # v4
        with:
          release-type: node
          package-name: nexusops
          changelog-types: '[{"type":"feat","section":"Features"},{"type":"fix","section":"Bug Fixes"},{"type":"docs","section":"Documentation"},{"type":"chore","section":"Chores"},{"type":"refactor","section":"Refactoring"},{"type":"perf","section":"Performance"},{"type":"security","section":"Security"}]'
          default-branch: main
          manifest-file: '.release-please-manifest.json'

  # ==========================================================================
  # Build and Push Backup Image (on release)
  # ==========================================================================
  build-backup-image:
    name: Build & Push Backup Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2a0b8d5b4e0f7556e67e # v3.5.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d5ed738b7b7b7b7b7b7b7b7b7b7b7b7b7b7b7 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push backup image (multi-arch)
        uses: docker/build-push-action@471d1dc4e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e # v5
        with:
          context: ./infra/backup
          file: ./infra/backup/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backup:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/backup:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Upload SBOM
        uses: actions/upload-artifact@65462800fd76c3416e12b7c4040f5640a0c0e1d7 # v4.3.3
        with:
          name: sbom-backup-${{ steps.version.outputs.version }}
          path: |
            sbom.spdx.json
          retention-days: 90

  # ==========================================================================
  # Publish Release Archive
  # ==========================================================================
  publish-release:
    name: Publish Release Archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [release-please, build-backup-image]
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create release archive
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          ARCHIVE="nexusops-${VERSION#v}.tar.gz"
          tar -czf "$ARCHIVE" \
            compose.yaml \
            compose.prod.yaml \
            compose.monitoring.yaml \
            .env.example \
            Makefile \
            scripts/ \
            infra/ \
            workflows/ \
            docs/ \
            --exclude='.git' \
            --exclude='*.md' \
            --exclude='tests/' \
            --exclude='state/'

      - name: Upload release asset
        uses: softprops/action-gh-release@0e7e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0e0 # v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: nexusops-${{ needs.release-please.outputs.version }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}