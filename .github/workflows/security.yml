# GitHub Actions - Security Scanning
# Triggered on PR, push to main, and weekly schedule

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly Monday 02:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # ==========================================================================
  # Gitleaks Secret Scanning
  # ==========================================================================
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@a86d044e7a5e6f4b3b3c3c3c3c3c3c3c3c3c3c3c3 # v2.5.0
        with:
          args: --verbose --redact --report-format=sarif --report-path=gitleaks.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b6271b1a9f2a2b2b2b2b2b2b2b2b2b2b2b2b2b2b2 # v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ==========================================================================
  # Trivy Filesystem Scan
  # ==========================================================================
  trivy-fs:
    name: Trivy Filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b6271b1a9f2a2b2b2b2b2b2b2b2b2b2b2b2b2b2b2 # v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ==========================================================================
  # Trivy Config Scan (Dockerfiles, compose, Kubernetes)
  # ==========================================================================
  trivy-config:
    name: Trivy Config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b6271b1a9f2a2b2b2b2b2b2b2b2b2b2b2b2b2b2b2 # v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ==========================================================================
  # Trivy Image Scan (Custom Backup Image)
  # ==========================================================================
  trivy-image:
    name: Trivy Image (Backup)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2a0b8d5b4e0f7556e67e # v3.5.0

      - name: Build backup image
        run: |
          docker buildx build --load -t nexusops-backup:test -f infra/backup/Dockerfile infra/backup/

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'image'
          image-ref: 'nexusops-backup:test'
          format: 'sarif'
          output: 'trivy-image.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b6271b1a9f2a2b2b2b2b2b2b2b2b2b2b2b2b2b2b2 # v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ==========================================================================
  # Dependency Review (for PRs)
  # ==========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Review dependencies
        uses: actions/dependency-review-action@7e4e4b6e8b8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8 # v4
        with:
          config-file: '.github/dependency-review-config.yml'
          fail-on-severity: high