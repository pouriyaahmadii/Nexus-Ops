# AutoForge / NexusOps - Production overrides
# Works with: COMPOSE_FILE=compose.yaml:compose.prod.yaml docker compose up -d
# Adds HTTPS (443), Let's Encrypt HTTP challenge, HTTP->HTTPS redirect,
# resource limits and log rotation. n8n runs in queue mode.
x-common_prod:
  &common_prod
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
      compress: "true"

services:
  traefik:
    <<: *common_prod
    image: "traefik:v3.4"
    container_name: nexusops_traefik
    user: "root"
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic/middlewares.yml"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.email=${LE_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=keep"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./infra/traefik/dynamic:/etc/traefik/dynamic:ro"
      - "letsencrypt:/letsencrypt"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=le"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@file"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_PASSWORD}"
      - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https@file"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # n8n queue mode (production, HTTPS)
  # --------------------------------------------------------------------------
  n8n-main:
    <<: *common_prod
    image: "n8nio/n8n:stable"
    container_name: nexusops_n8n_main
    user: "1000:1000"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.localhost}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "true"
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-main.rule=Host(`${N8N_HOST:-n8n.localhost}`)"
      - "traefik.http.routers.n8n-main.entrypoints=websecure"
      - "traefik.http.routers.n8n-main.tls.certresolver=le"
      - "traefik.http.routers.n8n-main.priority=10"
      - "traefik.http.routers.n8n-main.middlewares=sec-headers@file,webhook-rate-limit@file"
      - "traefik.http.services.n8n-main.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-webhook:
    <<: *common_prod
    image: "n8nio/n8n:stable"
    container_name: nexusops_n8n_webhook
    user: "1000:1000"
    command: ["webhook"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-n8n.localhost}/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "true"
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-webhook.rule=Host(`${N8N_HOST:-n8n.localhost}`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`) || PathPrefix(`/response`) || PathPrefix(`/form`) || PathPrefix(`/form-waiting`))"
      - "traefik.http.routers.n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.n8n-webhook.tls.certresolver=le"
      - "traefik.http.routers.n8n-webhook.priority=20"
      - "traefik.http.routers.n8n-webhook.middlewares=sec-headers@file,webhook-rate-limit@file"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-worker:
    <<: *common_prod
    image: "n8nio/n8n:stable"
    user: "1000:1000"
    command: ["worker"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "true"
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  postgres:
    <<: *common_prod
    image: "postgres:16"
    container_name: nexusops_postgres
    user: "999:999"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c shared_buffers=256MB"
      - "-c max_connections=100"
      - "-c log_min_duration_statement=1000"
      - "-c log_statement=ddl"
    volumes:
      - "postgres_data:/var/lib/postgresql/data/pgdata"
      - "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M

  redis:
    <<: *common_prod
    image: "redis:7"
    container_name: nexusops_redis
    user: "999:999"
    command:
      - "redis-server"
      - "--requirepass ${REDIS_PASSWORD}"
      - "--appendonly yes"
      - "--maxmemory-policy noeviction"
      - "--save 60 1"
      - "--save 300 10"
    volumes:
      - "redis_data:/data"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning PING"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

  qdrant:
    <<: *common_prod
    image: "qdrant/qdrant:v1.19.2"
    container_name: nexusops_qdrant
    user: "root"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG__LEVEL: INFO
    volumes:
      - "qdrant_storage:/qdrant/storage"
      - "qdrant_snapshots:/qdrant/snapshots"
    networks:
      - data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.qdrant.entrypoints=websecure"
      - "traefik.http.routers.qdrant.tls.certresolver=le"
      - "traefik.http.routers.qdrant.service=qdrant"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
      - "traefik.http.routers.qdrant.middlewares=sec-headers@file"
      - "traefik.http.routers.qdrant.labels.expose-qdrant=true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Backup service (production)
  # --------------------------------------------------------------------------
  backup:
    <<: *common_prod
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    container_name: nexusops_backup
    user: "1000:1000"
    environment:
      BACKUP_DIR: /backup/data
      TMP_DIR: /backup/tmp
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT}
      BACKUP_S3_ENABLED: ${BACKUP_S3_ENABLED:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-nexusops}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      N8N_DATA_PATH: /n8n/data
      TRAEFIK_ACME_PATH: /traefik/acme.json
    volumes:
      - "backups:/backup/data"
      - "n8n_data:/n8n/data:ro"
      - "letsencrypt:/traefik:ro"
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    entrypoint: ["/scripts/entrypoint.sh"]
    command: ["crontab"]
    healthcheck:
      test: ["CMD", "/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # --------------------------------------------------------------------------
  # n8n Bootstrap (one-shot): imports workflows, creates credentials, sets global error handler
  # --------------------------------------------------------------------------
  n8n-bootstrap:
    <<: *common_prod
    image: "n8nio/n8n:stable"
    container_name: nexusops_n8n_bootstrap
    user: "1000:1000"
    environment:
      WORKFLOWS_DIR: /workflows
      N8N_HOST: n8n-main
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_USER: ${N8N_BOOTSTRAP_USER:-admin}
      N8N_PASSWORD: ${N8N_BOOTSTRAP_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      OPS_WRITER_PASSWORD: ${OPS_WRITER_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID}
      DLQ_REPLAY_TOKEN: ${DLQ_REPLAY_TOKEN}
    volumes:
      - "./workflows:/workflows:ro"
      - "./infra/n8n/bootstrap.sh:/scripts/bootstrap.sh:ro"
    networks:
      - app
      - data
    depends_on:
      n8n-main:
        condition: service_healthy
      n8n-webhook:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/bootstrap.sh"]
    deploy:
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 1

  # --------------------------------------------------------------------------
  # Mock LLM Service (demo profile only)
  # --------------------------------------------------------------------------
  mock-llm:
    <<: *common_prod
    build:
      context: ./infra/mock-llm
      dockerfile: Dockerfile
    container_name: nexusops_mock_llm
    user: "root"
    environment:
      PORT: 8080
      MOCK_FAILURE_RATE: 0.3
    profiles: ["demo"]
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  letsencrypt:
  backups:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
