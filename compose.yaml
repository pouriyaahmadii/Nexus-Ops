# ==============================================================================
# NexusOps - Production Automation Platform Compose Definition
# ==============================================================================
name: nexusops

services:
  # ----------------------------------------------------------------------------
  # Ingress / Reverse Proxy (Traefik v3)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.7.15  # Pinned explicit tag; bumped to v3.7.15 for Docker Engine 29+ API auto-negotiation
    container_name: nexusops_traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Host ports 8080/8443 used to avoid collisions with privileged ports and AgentOps
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexusops_app"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`) || (Host(`localhost`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`)))"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  # ----------------------------------------------------------------------------
  # Relational Database (PostgreSQL 16) - Strictly Isolated
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine  # Pinned explicit tag; PostgreSQL 16 LTS Alpine variant
    container_name: nexusops_postgres
    restart: unless-stopped
    # Strictly internal: No published host ports to prevent 5432 collision with AgentOps
    networks:
      - data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # In-Memory Cache & Message Broker (Redis 7) - Strictly Isolated
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine  # Pinned explicit tag; Redis 7.4 Alpine
    container_name: nexusops_redis
    restart: unless-stopped
    # Strictly internal: No published host ports to prevent 6379 collision with AgentOps
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - data
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Vector Database (Qdrant)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.2  # Pinned explicit tag
    container_name: nexusops_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Automation Core - Editor & Orchestration (n8n Main)
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.80.0  # Pinned explicit release tag
    container_name: nexusops_n8n
    restart: unless-stopped
    networks:
      - app
      - data
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=nexusops_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-nexusops}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-nexusops}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=nexusops_redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${DOMAIN_NAME:-nexusops.localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://nexusops.localhost:8080/}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexusops_app"
      - "traefik.http.routers.n8n.rule=Host(`nexusops.localhost`) || Host(`localhost`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ----------------------------------------------------------------------------
  # Automation Core - Dedicated Webhook Processor (n8n Webhook)
  # ----------------------------------------------------------------------------
  n8n_webhook:
    image: docker.n8n.io/n8nio/n8n:1.80.0
    container_name: nexusops_n8n_webhook
    restart: unless-stopped
    command: webhook
    networks:
      - app
      - data
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=nexusops_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-nexusops}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-nexusops}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=nexusops_redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${DOMAIN_NAME:-nexusops.localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${WEBHOOK_URL:-http://nexusops.localhost:8080/}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexusops_app"
      - "traefik.http.routers.n8n-webhook.rule=(Host(`nexusops.localhost`) || Host(`localhost`)) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.n8n-webhook.entrypoints=web"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
      - "traefik.http.routers.n8n-webhook.priority=100"

  # ----------------------------------------------------------------------------
  # Automation Core - Background Queue Worker (n8n Worker)
  # ----------------------------------------------------------------------------
  n8n_worker:
    image: docker.n8n.io/n8nio/n8n:1.80.0
    container_name: nexusops_n8n_worker
    restart: unless-stopped
    command: worker
    networks:
      - app
      - data
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=nexusops_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-nexusops}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-nexusops}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=nexusops_redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'n8n worker' || pgrep -f 'node' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

# ==============================================================================
# Strict Network Segmentation
# ==============================================================================
networks:
  # Ingress traffic network
  edge:
    name: nexusops_edge
    driver: bridge

  # Application interconnect bridge (Traefik -> n8n, Qdrant)
  app:
    name: nexusops_app
    driver: bridge

  # Fully isolated data tier (PostgreSQL, Redis, Qdrant)
  data:
    name: nexusops_data
    driver: bridge
    internal: true

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: nexusops_postgres_data
  redis_data:
    name: nexusops_redis_data
  qdrant_data:
    name: nexusops_qdrant_data
  n8n_data:
    name: nexusops_n8n_data
