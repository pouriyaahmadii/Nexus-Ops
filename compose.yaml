# AutoForge / NexusOps - Core stack (base, local HTTP)
# Works with: docker compose up -d
# Services are reachable over plain HTTP on *.localhost (n8n.localhost, traefik.localhost).
# n8n runs in queue mode: n8n-main (UI/API), n8n-webhook (webhook processor),
# n8n-worker (scalable execution workers).
# No top-level "version:" key (Compose v2 spec).
x-common:
  &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  traefik:
    <<: *common
    image: "traefik:v3.4"
    container_name: nexusops_traefik
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic/middlewares.yml"
      - "--providers.file.watch=true"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--accesslog=true"
      - "--accesslog.format=json"
    ports:
      - "80:80"
    volumes:
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./infra/traefik/dynamic:/etc/traefik/dynamic:ro"
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    <<: *common
    image: "postgres:16"
    container_name: nexusops_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexusops}
      POSTGRES_USER: ${POSTGRES_USER:-nexusops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c shared_buffers=256MB"
      - "-c max_connections=100"
      - "-c log_min_duration_statement=1000"
      - "-c log_statement=ddl"
    volumes:
      - "postgres_data:/var/lib/postgresql/data/pgdata"
      - "./infra/postgres/init:/docker-entrypoint-initdb.d:ro"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexusops} -d ${POSTGRES_DB:-nexusops}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *common
    image: "redis:7"
    container_name: nexusops_redis
    command:
      - "redis-server"
      - "--requirepass ${REDIS_PASSWORD}"
      - "--appendonly yes"
      - "--maxmemory-policy noeviction"
      - "--save 60 1"
      - "--save 300 10"
    volumes:
      - "redis_data:/data"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning PING"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    <<: *common
    image: "qdrant/qdrant:v1.19.2"
    container_name: nexusops_qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__LOG__LEVEL: INFO
    volumes:
      - "qdrant_storage:/qdrant/storage"
      - "qdrant_snapshots:/qdrant/snapshots"
    networks:
      - data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # n8n queue mode
  # --------------------------------------------------------------------------
  # n8n-main: UI, REST API, schedules, and any route not claimed by webhook.
  # n8n-webhook: dedicated /webhook*, /webhook-test*, /response*, /form* processor.
  # n8n-worker: picks up queued executions from Redis. Scale with WORKER_REPLICAS.
  # All roles share Postgres, Redis (Bull queue) and N8N_ENCRYPTION_KEY.

  n8n-main:
    <<: *common
    image: "n8nio/n8n:stable"
    container_name: nexusops_n8n_main
    user: "1000:1000"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://n8n.localhost/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "false"           # set true in prod (HTTPS)
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-main.rule=Host(`${N8N_HOST:-n8n.localhost}`)"
      - "traefik.http.routers.n8n-main.entrypoints=web"
      - "traefik.http.routers.n8n-main.priority=10"
      - "traefik.http.services.n8n-main.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-webhook:
    <<: *common
    image: "n8nio/n8n:stable"
    container_name: nexusops_n8n_webhook
    user: "1000:1000"
    command: ["webhook"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-n8n.localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://n8n.localhost/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "false"
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-webhook.rule=Host(`${N8N_HOST:-n8n.localhost}`) && (PathPrefix(`/webhook`) || PathPrefix(`/webhook-test`) || PathPrefix(`/response`) || PathPrefix(`/form`) || PathPrefix(`/form-waiting`))"
      - "traefik.http.routers.n8n-webhook.entrypoints=web"
      - "traefik.http.routers.n8n-webhook.priority=20"
      - "traefik.http.services.n8n-webhook.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  n8n-worker:
    <<: *common
    image: "n8nio/n8n:stable"
    user: "1000:1000"
    command: ["worker"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nexusops}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nexusops}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      EXECUTIONS_MODE: queue
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: ${QUEUE_BULL_REDIS_DB:-0}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      N8N_TELEMETRY_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NODE_FUNCTION_ALLOW_EXTERNAL: "*"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 10000
      EXECUTIONS_DATA_PRUNE_MAX_AGE: 336h   # 14 days
      N8N_SECURE_COOKIE: "false"
      NODES_EXCLUDE: "@n8n/n8n-nodes-langchain.executeCommand"
      N8N_DEFAULT_BINARY_DATA_MODE: ${N8N_DEFAULT_BINARY_DATA_MODE:-database}
      N8N_GRACEFUL_SHUTDOWN_TIMEOUT: ${N8N_GRACEFUL_SHUTDOWN_TIMEOUT:-30}
    volumes:
      - "n8n_data:/home/node/.n8n"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  qdrant_snapshots:
  n8n_data:

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
