# ==============================================================================
# NexusOps - Traefik v3 Static Configuration
# ==============================================================================
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO


api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "nexusops_app"

ping:
  entryPoint: "web"
